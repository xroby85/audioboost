name: Build AudioBoost APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v3

      # ── Python 3.10 (3.11 are incompatibilități cu buildozer/cython) ──
      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # ── Cache buildozer + Android SDK/NDK (~3GB, evită 20min reinstall) ──
      - name: Cache buildozer global dir
        uses: actions/cache@v3
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      # ── Dependențe sistem ──────────────────────────────────────────────
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            git zip unzip \
            openjdk-17-jdk \
            autoconf libtool pkg-config \
            cmake ninja-build ccache \
            libssl-dev libffi-dev zlib1g-dev \
            python3-dev

      # ── Instalare buildozer + cython versiuni compatibile ─────────────
      - name: Install buildozer and cython
        run: |
          pip install --upgrade pip
          pip install buildozer==1.5.0 cython==0.29.37
          # Forțăm p4a develop pentru numpy/scipy actualizat
          pip install python-for-android

      # ── Setare JAVA_HOME ──────────────────────────────────────────────
      - name: Set JAVA_HOME
        run: echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV

      # ── Build APK ─────────────────────────────────────────────────────
      - name: Build APK
        timeout-minutes: 60
        run: |
          buildozer -v android debug 2>&1 | tee build.log
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          ANDROID_SDK_ROOT: ${{ github.workspace }}/.buildozer/android/platform/android-sdk

      # ── Upload APK ca artifact ────────────────────────────────────────
      - name: Find APK
        id: find_apk
        run: |
          APK=$(find . -name "*.apk" | head -1)
          echo "apk_path=$APK" >> $GITHUB_OUTPUT
          echo "APK găsit: $APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AudioBoost-APK
          path: ${{ steps.find_apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30

      # ── Upload log dacă build a eșuat ─────────────────────────────────
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
