name: Build AudioBoost APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config \
            cmake ninja-build ccache \
            libssl-dev libffi-dev zlib1g-dev \
            python3.10 python3.10-dev python3.10-venv

      - name: Setup Python 3.10 venv
        run: |
          python3.10 -m venv ~/p4a-env
          ~/p4a-env/bin/pip install --upgrade pip
          ~/p4a-env/bin/pip install buildozer==1.5.0 cython==3.0.11

      - name: Build APK
        timeout-minutes: 60
        run: |
          export PATH=~/p4a-env/bin:$HOME/.local/bin:$PATH
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AudioBoost-APK
          path: bin/*.apk
          retention-days: 30
